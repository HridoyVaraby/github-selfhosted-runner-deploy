name: CI & Deploy (Docker + webhook)

# Template: build gates → docker image (tagged by commit SHA) → registry push
# → redeploy webhook. Adjust: OWNER/APP, branch, package-manager commands,
# registry (GHCR shown; for Docker Hub swap login-action registry/username and
# a DOCKERHUB_TOKEN secret).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for GHCR push

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci-deploy:
    runs-on: ubuntu-latest   # or self-hosted — logic is identical
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, scope-limited

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/OWNER/APP:${{ github.sha }}
            ghcr.io/OWNER/APP:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger redeploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tag":"${{ github.sha }}"}')
          [ "$code" = "200" ] || { echo "webhook failed: HTTP $code"; exit 1; }
          echo "redeploy triggered for ${{ github.sha }}"

# Receiver side (Portainer/Dokploy/Coolify/custom): pull the SHA tag passed in
# the payload and recreate the container. NEVER redeploy by re-pushing a
# mutable tag — servers cache tags and silently keep the old image.
